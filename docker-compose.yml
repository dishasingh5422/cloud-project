services:
  app:
    build:
      context: ./app

    container_name: cloud-api

    ports:
      - "3000:3000"

    environment:
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/cloudapp

    depends_on:
      - postgres
  postgres:
    image: postgres:16
    container_name: cloud-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cloudapp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./app/src/sql/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro


volumes:
  postgres_data:
